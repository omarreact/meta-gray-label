name: Refresh Meta Grey Label PNG icon assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/media/branding/logo-symbol.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert approved SVG into platform icons
        run: |
          python -m pip install --quiet --disable-pip-version-check cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          root=Path('assets/media/branding')
          svg=(root/'logo-symbol.svg').read_bytes()
          for file,size in [
              ('favicon-32.png',32),
              ('apple-touch-icon.png',180),
              ('icon-192.png',192),
              ('icon-512.png',512)]:
              cairosvg.svg2png(bytestring=svg,write_to=str(root/file),output_width=size,output_height=size)
          PY
      - name: Save generated site icons to main
        run: |
          if git diff --quiet -- assets/media/branding/*.png; then
            echo "Site icons are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/branding/favicon-32.png assets/media/branding/apple-touch-icon.png assets/media/branding/icon-192.png assets/media/branding/icon-512.png
          git commit -m "Sync PNG site icons with updated MG logo"
          git push origin HEAD:main
