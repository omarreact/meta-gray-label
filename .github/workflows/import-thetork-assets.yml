name: Import verified ZIP contents

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-thetork-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download and verify all files against uploaded ZIP checksums
