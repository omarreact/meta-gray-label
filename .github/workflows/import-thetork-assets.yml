          entries=[]
          for line in manifest.splitlines():
              digest,name=line.split('  ', 1)
              if name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts:
                  raise RuntimeError('Invalid relative path: '+name)
              entries.append((digest,name))
          # Download and verify all files before writing any of them.
          downloads=[]
          for digest,name in entries:
              url=base+quote(name,safe='/')
              last_error=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={
                          'User-Agent':'Mozilla/5.0 (compatible; static-theme-archive-import/1.0)',
                          'Referer':base,
                          'Accept':'*/*',
                      })
                      with urllib.request.urlopen(req,timeout=25) as r:
                          data=r.read()
                      actual=hashlib.sha256(data).hexdigest()
                      if actual != digest:
                          raise ValueError(f'Checksum mismatch for {name}: expected {digest}, got {actual}')
                      downloads.append((name,data))
                      print('VERIFIED',name,len(data))
                      last_error=None
                      break
                  except Exception as e:
                      last_error=e
                      if attempt<2: time.sleep(2*(attempt+1))
              if last_error is not None:
                  raise RuntimeError(f'Could not reproduce ZIP file {name}: {last_error}')
          for name,data in downloads:
              target=pathlib.Path(name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          print('VERIFIED AND WRITTEN',len(downloads),'files')
          PYIMPORT

      - name: Commit imported archive to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/
          if git diff --cached --quiet; then
            echo 'Already identical; nothing to commit.'
          else
            git commit -m 'Import verified Thetork static website files from supplied ZIP'
            git push origin HEAD:main
          fi
