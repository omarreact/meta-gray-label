name: Apply site settings

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[Site Settings]')
    runs-on: ubuntu-latest
    concurrency:
      group: site-settings-main
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and apply requested setting
        env:
          ISSUE_BODY: \${{ github.event.issue.body }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/<!-- MGL_SITE_SETTINGS_V2\s*([\s\S]*?)\s*-->/);
          if (!match) throw new Error('Missing MGL_SITE_SETTINGS_V2 payload.');

          const request = JSON.parse(match[1]);
          const systemFamilies = new Set([
            'Arial','Helvetica','Georgia','Times New Roman','Verdana','Tahoma','Trebuchet MS','Courier New'
          ]);

          const family = String(request.globalFontFamily || '').trim();
          if (!/^[A-Za-z0-9 .&+'-]{1,100}$/.test(family)) throw new Error('Invalid font family.');
          const provider = systemFamilies.has(family) ? 'system' : 'google';
          if (request.provider !== provider) throw new Error('Font provider mismatch.');

          const number = (value, min, max, label) => {
            const parsed = Number(value);
            if (!Number.isFinite(parsed) || parsed < min || parsed > max) {
              throw new Error(label + ' is outside the supported range.');
            }
            return parsed;
          };
          const weight = (value, label) => {
            const parsed = number(value, 100, 900, label);
            if (parsed % 100 !== 0) throw new Error(label + ' must be a 100-step CSS weight.');
            return parsed;
          };

          const headingSizes = request.headingSizes || {};
          const normalized = {
            globalFontFamily: family,
            provider,
            fallback: 'Arial, Helvetica, sans-serif',
            bodySizePx: number(request.bodySizePx, 12, 28, 'Body size'),
            bodyWeight: weight(request.bodyWeight, 'Body weight'),
            bodyLineHeight: number(request.bodyLineHeight, 1.1, 2.2, 'Body line height'),
            bodyLetterSpacingEm: number(request.bodyLetterSpacingEm, -0.08, 0.2, 'Body letter spacing'),
            headingWeight: weight(request.headingWeight, 'Heading weight'),
            headingLineHeight: number(request.headingLineHeight, 0.9, 1.6, 'Heading line height'),
            headingLetterSpacingEm: number(request.headingLetterSpacingEm, -0.12, 0.12, 'Heading letter spacing'),
            headingSizes: {
              h1: number(headingSizes.h1, 28, 120, 'H1 size'),
              h2: number(headingSizes.h2, 26, 100, 'H2 size'),
              h3: number(headingSizes.h3, 20, 72, 'H3 size'),
              h4: number(headingSizes.h4, 18, 56, 'H4 size'),
              h5: number(headingSizes.h5, 16, 48, 'H5 size'),
              h6: number(headingSizes.h6, 14, 40, 'H6 size')
            },
            uiSizePx: number(request.uiSizePx, 11, 22, 'UI size'),
            uiWeight: weight(request.uiWeight, 'UI weight'),
            buttonSizePx: number(request.buttonSizePx, 11, 22, 'Button size'),
            buttonWeight: weight(request.buttonWeight, 'Button weight')
          };

          const configPath = 'assets/site-settings.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.version = 2;
          config.typography = normalized;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');

          NODE

      - name: Commit setting to main
        id: commit
        run: |
          if git diff --quiet -- assets/site-settings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-settings.json
          git commit -m "Apply global typography site setting"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report result and close request
        env:
          GH_TOKEN: \${{ github.token }}
          ISSUE_NUMBER: \${{ github.event.issue.number }}
          CHANGED: \${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ Typography settings applied to main. Normal validation and deployment will run from the new commit."
          else
            gh issue comment "$ISSUE_NUMBER" --body "✅ No code change was required; these typography settings already match main."
          fi
          gh issue close "$ISSUE_NUMBER" --reason completed
