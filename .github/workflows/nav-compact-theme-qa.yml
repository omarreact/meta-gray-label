name: Temporary centered navigation and compact theme QA
on:
  push:
    branches:
      - fix/center-navigation-compact-theme-20261119
    paths:
      - .github/workflows/nav-compact-theme-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preserve styling, logo and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/style.css)" = "90b42525c97a20e380ca4c01edea60d3d3eb22d0"
          node --check assets/js/custom.js
          node --check assets/js/includes.js
          grep -q 'width: 38px !important' index.html
          grep -q 'justify-content: center;' header.html
          grep -q 'mgl-social-links' header.html
          grep -q 'logo-light.svg' header.html
      - name: Browser check alignment and theme size at five viewports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text()
          probe=r"""
          <script>
          window.addEventListener('load', () => {
            setTimeout(() => {
              const qs = s => document.querySelector(s);
              const rect = e => {
                if (!e) return null;
                const r=e.getBoundingClientRect();
                return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height,cx:r.left+r.width/2,cy:r.top+r.height/2};
              };
              const visible=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0;
              const logo=qs('.header-wrapper > .logo');
              const menu=qs('.header-wrapper > .menu-area > .menu');
              const menuBox=qs('.header-wrapper > .menu-area');
              const action=qs('.header-wrapper > .header-action');
              const toggle=qs('#btnSwitch');
              const icon=qs('#btnSwitch img');
              const hamburger=qs('.header-bar');
              const result={
                viewport:innerWidth,theme:document.documentElement.getAttribute('data-bs-theme'),
                logo:rect(logo),menu:rect(menu),menuBox:rect(menuBox),action:rect(action),
                menuVisible:visible(menu),burgerVisible:visible(hamburger),
                menuJustify:menu?getComputedStyle(menu).justifyContent:null,
                menuBoxJustify:menuBox?getComputedStyle(menuBox).justifyContent:null,
                toggle:rect(toggle),icon:rect(icon),
                toggleBackground:toggle?getComputedStyle(toggle).backgroundColor:'',
                headerLogoSrc:qs('img[data-brand-logo]')?.getAttribute('src'),
                socialCount:document.querySelectorAll('header .mgl-social-link').length,
                footerSocialCount:document.querySelectorAll('footer .mgl-share-icon').length,
                footerPresent:!!document.querySelector('footer')
              };
              const out=document.createElement('script');
              out.type='application/json';out.id='navigation-qa';out.textContent=JSON.stringify(result);
              document.body.appendChild(out);
            },1200);
          });
          </script>"""
          Path('__nav_qa.html').write_text(page.replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8132 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          for width in 390 768 1024 1280 1440 1650; do
            for mode in light dark; do
              timeout 35 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5500 --window-size="$width,900" --dump-dom \
                "http://127.0.0.1:8132/__nav_qa.html?theme=$mode" > "/tmp/nav-$width-$mode.html" 2>"/tmp/chrome-$width-$mode.log"
              WIDTH="$width" MODE="$mode" python3 - <<'PY'
          import os,re,html,json
          width=int(os.environ['WIDTH']);mode=os.environ['MODE']
          src=open(f'/tmp/nav-{width}-{mode}.html').read()
          m=re.search(r'<script type="application/json" id="navigation-qa">(.+?)</script>',src,re.S)
          assert m,f"No measurements {width} {mode}"
          d=json.loads(html.unescape(m.group(1)))
          assert d['theme']==mode,d
          assert d['footerPresent'] and d['socialCount']==2 and d['footerSocialCount']==2,d
          assert d['headerLogoSrc'].endswith('logo-dark.svg' if mode=='dark' else 'logo-light.svg'),d
          assert d['toggle'] and 37<=d['toggle']['width']<=39 and 37<=d['toggle']['height']<=39,d
          assert d['icon'] and 19<=d['icon']['width']<=21 and 19<=d['icon']['height']<=21,d
          assert d['toggle']['x']<50 and d['toggleBackground']=='rgb(0, 201, 155)',d
          if d['viewport']>=992:
              assert d['menuVisible'] and d['menuBoxJustify']=='center' and d['menuJustify']=='center',d
              assert abs(d['menu']['cx']-d['menuBox']['cx'])<5,d
              assert abs(d['menu']['cy']-d['logo']['cy'])<32,d
              assert d['menu']['x']>=d['logo']['right']-6,d
              assert d['menu']['right']<=d['action']['x']+6,d
          else:
              assert d['burgerVisible'],d
          print(f"PASS {width}px actual {d['viewport']}px {mode}: toggle {d['toggle']['width']:.0f}px centered-nav={d['menuBoxJustify']}")
          PY
            done
          done
