name: Temporary homepage staging QA
on:
  push:
    branches:
      - content/meta-grey-label-homepage-20261119
    paths:
      - .github/workflows/staging-homepage-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript, asset and link checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/style.css)" = "90b42525c97a20e380ca4c01edea60d3d3eb22d0"
          node --check assets/js/custom.js
          node --check assets/js/includes.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sections=[]; self.ids=[]; self.refs=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='section': self.sections.append(a.get('id'))
                  if 'id' in a: self.ids.append(a['id'])
                  if 'href' in a: self.refs.append(a['href'])
                  if tag=='img': self.images.append(a.get('src',''))
          root=Path('.'); audits={}
          for name in ['index.html','header.html','footer.html']:
              a=Audit(); a.feed((root/name).read_text()); audits[name]=a
              for item in a.images:
                  if item.startswith('./') and not (root/item).is_file():
                      raise AssertionError(f'{name} missing image: {item}')
              for item in a.refs:
                  if item.endswith('.html') and item!='index.html':
                      raise AssertionError(f'{name} broken link: {item}')
          assert len(audits['index.html'].sections)==11
          for sec in ['home','about','benefits','services','roadmap','models','capabilities','resources','why','faq','contact']:
              assert sec in audits['index.html'].sections,sec
          for name,a in audits.items():
              for link in a.refs:
                  if link.startswith('index.html#'):
                      assert link.split('#',1)[1] in audits['index.html'].ids, f'{name}: {link}'
                  if link.startswith('#') and link!='#':
                      assert link[1:] in audits['index.html'].ids, f'{name}: {link}'
          assert len(audits['index.html'].ids)==len(set(audits['index.html'].ids)), 'Duplicate IDs'
          text=(root/'index.html').read_text()
          for unwanted in ['$99/','$149/','$199/','Dianne Russell','Martha Chumo','Subscribe our news']:
              assert unwanted not in text, unwanted
          assert 'href="./assets/css/style.css"' in text
          print('PASS: 11 sections, relative assets, working navigation, no duplicate IDs')
          PY
      - name: Local HTTP and mobile rendered DOM smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/homepage-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          for path in index.html header.html footer.html assets/css/style.css media/branding/logo-light.svg; do
            curl --fail --silent --show-error "http://127.0.0.1:8123/$path" -o /dev/null
          done
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            timeout 50 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=6500 --window-size=390,844 --dump-dom \
              'http://127.0.0.1:8123/index.html' > /tmp/rendered.html 2>/tmp/chrome-errors.txt
            wc -c /tmp/rendered.html
            grep -q 'class="header-section' /tmp/rendered.html
            grep -q 'class="footer' /tmp/rendered.html
            grep -q 'id="models"' /tmp/rendered.html
            grep -q 'technology provider' /tmp/rendered.html
            echo 'PASS: rendered homepage with dynamic header and footer'
          else
            echo 'SKIP: Chrome unavailable; HTTP and static validations passed'
          fi
