name: Build and validate complete WordPress import
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordpress-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          repository: omarreact/WpBlockThemeFSE
          ref: 4d179b6795320f1515890e530b4779b79e015771
          path: converter
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate import source freshness and completeness
        working-directory: source
        run: node tests/wordpress-source.mjs
      - name: Build complete 53-page theme and WXR
        working-directory: converter
        run: |
          python scripts/build-structured-site.py --source-root ../source --out-dir build/meta-gray-label
          python scripts/verify-structured-build.py build/meta-gray-label --expected-pages 53 --expected-theme pin-site-meta-grey-label
      - name: Start isolated WordPress
        working-directory: converter
        run: |
          bash scripts/wordpress-test.sh start
          bash scripts/wordpress-test.sh run cli wp theme install /var/www/html/wp-content/themes/pin-universal-fse/build/meta-gray-label/pin-site-meta-grey-label.zip --force --activate
          bash scripts/wordpress-test.sh run cli wp plugin install wordpress-importer --activate
          bash scripts/wordpress-test.sh run cli wp eval 'foreach(get_posts(array("post_type"=>"page","post_status"=>"any","numberposts"=>-1)) as $p) wp_delete_post($p->ID,true);'
          bash scripts/wordpress-test.sh run cli wp import /var/www/html/wp-content/themes/pin-universal-fse/build/meta-gray-label/website.xml --authors=create
          bash scripts/wordpress-test.sh run cli wp eval '$home=get_page_by_path("home",OBJECT,"page"); update_option("show_on_front","page"); update_option("page_on_front",$home->ID); global $wp_rewrite; $wp_rewrite->set_permalink_structure("/%postname%/"); $wp_rewrite->flush_rules(true);'
      - name: Validate WordPress frontend, editor and independent page template
        working-directory: converter
        run: |
          bash scripts/wordpress-test.sh run cli wp eval-file wp-content/themes/pin-universal-fse/tests/wp-structured-build.php
          bash scripts/wordpress-test.sh run cli wp eval '$page=get_page_by_path("index-2",OBJECT,"page"); if(!$page||get_page_template_slug($page)!=="pin-standalone")throw new Exception("Home 02 template missing");'
          bash scripts/wordpress-test.sh run cli wp eval-file wp-content/themes/pin-universal-fse/tests/gutenberg/export-input.php
          npm ci --prefix tests/gutenberg --ignore-scripts --no-fund --no-audit
          node tests/gutenberg/validate.cjs build/gutenberg-input.json
      - name: Install browser QA tooling
        run: |
          npm install --prefix /tmp/mgl-wp-qa --no-package-lock --ignore-scripts playwright@1.58.2
          /tmp/mgl-wp-qa/node_modules/.bin/playwright install chromium
      - name: Compare static source and WordPress desktop/mobile behavior
        run: |
          python3 -m http.server 4173 --directory source >/tmp/mgl-source-http.log 2>&1 &
          NODE_PATH=/tmp/mgl-wp-qa/node_modules node source/tests/wordpress-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-grey-label-wordpress-complete
          path: |
            converter/build/meta-gray-label/website.xml
            converter/build/meta-gray-label/pin-site-meta-grey-label.zip
            converter/build/meta-gray-label/pin-site-meta-grey-label/build-report.json
            wordpress-qa/
          if-no-files-found: error
      - name: Stop isolated WordPress
        if: always()
        working-directory: converter
        run: bash scripts/wordpress-test.sh stop
