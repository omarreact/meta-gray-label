name: Validate HTML and JavaScript website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "data/**"
      - "assets/**"
      - "media/**"
      - "scripts/**"
      - "src/**"
      - "worker.js"
      - "wrangler.jsonc"
      - "tests/**"
      - "**/*.html"
      - "style.css"
      - "package.json"
      - ".github/workflows/validate-content.yml"
      - ".github/workflows/apply-site-settings.yml"
      - ".devcontainer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static build and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript source syntax
        run: |
          for file in worker.js src/*.js assets/js/site-settings.js assets/js/directories.js assets/js/contact-brief.js scripts/*.mjs tests/architecture.mjs tests/dynamic-renderer.mjs tests/directories.mjs tests/inner-system.mjs tests/inner-links.mjs tests/responsive-browser.mjs tests/inner-browser.mjs tests/inner-routes-browser.mjs tests/phase2-browser.mjs; do
            node --check "$file"
          done
      - name: Audit HTML architecture, content, SEO and assets
        run: |
          node tests/architecture.mjs
          node scripts/audit-seo.mjs --check
          node scripts/audit-assets.mjs
          node tests/dynamic-renderer.mjs
          node tests/directories.mjs
          node tests/inner-system.mjs
          node tests/inner-links.mjs
      - name: Validate optional JavaScript edge renderer assets
        run: |
          node scripts/build-dynamic.mjs
          test -f dist/public/index.html
          test -f dist/public/services.html
          test ! -e dist/public/about-us/index.html
      - name: Validate GitHub Pages static HTML build
        env:
          PUBLIC_BASE_URL: https://omarreact.github.io/meta-gray-label
          BASE_PATH: /meta-gray-label
        run: |
          npm run build
          test -f dist/public/index.html
          test -f dist/public/about-us/index.html
          test -f dist/public/forex-grey-label/mt5-grey-label/index.html
          test -f dist/public/404.html
          grep -q 'https://mg-label.webflow.io/about-us/' dist/public/about-us/index.html
          grep -q '/meta-gray-label/assets/css/style.css' dist/public/about-us/index.html
          ! grep -R -q 'meta-gray-label-dynamic.farukkhanone.workers.dev' dist/public
      - name: Validate root-host static HTML build
        env:
          PUBLIC_BASE_URL: https://mg-label.webflow.io
          BASE_PATH: ""
        run: |
          npm run build
          test -f dist/public/index.html
          test -f dist/public/services.html
          test -f dist/public/solutions/index.html
          test -f dist/public/insights/index.html
          test -f dist/public/contact/index.html
          test -f dist/public/forex-grey-label/mt5-grey-label/index.html
          grep -q 'https://mg-label.webflow.io/about-us/' dist/public/about-us/index.html
          grep -q 'href="/assets/css/style.css"' dist/public/about-us/index.html
          ! grep -R -q '/meta-gray-label/assets/' dist/public
      - name: Validate host-neutral generated HTML routes
        run: |
          tmpdir="$(mktemp -d)"
          cp -a . "$tmpdir/site"
          cd "$tmpdir/site"
          PUBLIC_BASE_URL=https://mg-label.webflow.io node scripts/materialize-pages.mjs
          grep -q 'https://mg-label.webflow.io/about-us/' about-us/index.html
          grep -q 'href="../assets/css/style.css"' about-us/index.html
          grep -q 'href="../../assets/css/style.css"' forex-grey-label/mt5-grey-label/index.html
          grep -q 'href="../"' about-us/index.html
          ! grep -R -q 'meta-gray-label-dynamic.farukkhanone.workers.dev' about-us forex-grey-label

  responsive-web:
    name: Responsive HTML/JavaScript QA (desktop and mobile)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build browser fixtures
        run: node scripts/build-dynamic.mjs
      - name: Install Chromium QA
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Validate homepage, settings and contact interactions
        run: node tests/responsive-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-html-screenshots
          path: tmp/responsive-browser-screens/
          if-no-files-found: ignore
          retention-days: 7

  inner-page-reference:
    name: Static HTML pages (8 widths, 2 themes)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build all HTML routes
        run: PUBLIC_BASE_URL=https://mg-label.webflow.io node scripts/build-static.mjs
      - name: Install Chromium QA
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Test responsive layouts, directories and browser interactions
        run: |
          node tests/inner-browser.mjs
          node tests/inner-routes-browser.mjs
          node tests/phase2-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-html-visual-evidence
          path: tmp/inner-static/
          retention-days: 14
