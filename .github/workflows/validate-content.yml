name: Validate standalone HTML website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    name: Check JS, routes and local assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: |
          for file in assets/js/*.js; do node --check "$file"; done
      - name: Verify all inner pages and local references
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path').posix,assert=require('node:assert/strict');
          const pages=fs.readdirSync('.', {withFileTypes:true}).filter(e=>e.isDirectory()&&fs.existsSync(e.name+'/index.html')).map(e=>e.name+'/index.html');
          assert.equal(pages.length,51,'Expected 51 post-name permalink pages');
          for(const file of ['index.html','404.html','assets/js/includes.js','assets/js/custom.js',
            'assets/js/site-settings.json','assets/css/style.css','assets/media/branding/favicon.svg',
            'site-manifest.json','design-tokens.json','pin-import/header.html','pin-import/footer.html']){
            assert(fs.existsSync(file),'Missing '+file);
          }
          const manifest=JSON.parse(fs.readFileSync('site-manifest.json','utf8'));
          const tokens=JSON.parse(fs.readFileSync('design-tokens.json','utf8'));
          assert.equal(manifest.version,1,'Unsupported PIN import manifest version');
          assert.equal(manifest.pages.length,52,'Expected 52 importable website pages (404 is a theme template, not a Page)');
          assert.equal(new Set(manifest.pages.map(p=>p.path)).size,manifest.pages.length,'Duplicate manifest routes');
          assert.equal(new Set(manifest.pages.map(p=>p.file)).size,manifest.pages.length,'Duplicate manifest source files');
          assert(!manifest.pages.some(p=>p.file==='404.html'),'404.html must not import as a WordPress Page');
          for(const entry of manifest.pages){
            assert(entry.path&&entry.file&&entry.title,'Incomplete manifest page entry: '+JSON.stringify(entry));
            assert(fs.existsSync(entry.file)&&fs.statSync(entry.file).isFile(),'Manifest source missing: '+entry.file);
          }
          for(const fragment of [manifest.header?.file,manifest.footer?.file]){
            assert(fragment&&fs.existsSync(fragment)&&fs.statSync(fragment).isFile(),'Missing manifest template fragment: '+fragment);
          }
          assert(tokens.colors&&tokens.typography&&tokens.layout,'Incomplete PIN design tokens');

          let checked=0;
          for(const file of ['index.html',...pages]){
            const s=fs.readFileSync(file,'utf8');
            assert(/<main\b/i.test(s),'Missing main: '+file);
            assert(/<title>/i.test(s),'Missing title: '+file);
            for(const match of s.matchAll(/\b(?:href|src|poster)=(["'])(.*?)\1/gi)){
              const value=match[2].trim();
              if(!value||value[0]==='#'||/^(?:https?:|data:|mailto:|tel:|javascript:|\/\/)/i.test(value))continue;
              const local=value.split(/[?#]/)[0];
              if(!local)continue;
              const resolved=path.normalize(path.join(path.dirname(file),local));
              const target=local.endsWith('/')?path.join(resolved,'index.html'):resolved;
              assert(fs.existsSync(target)&&fs.statSync(target).isFile(),
                'Broken '+file+': '+value+' -> '+target);
              checked++;
            }
            assert(!s.includes('assets/images/'),'Old media ref: '+file);
            assert(!s.includes('assets/inner-pages/'),'Legacy route remains: '+file);
            if(file!=='index.html'){
              const slug=file.split('/')[0];
              const canonical='https://mg-label.webflow.io/'+slug+'/';
              assert(s.includes('rel="canonical" href="'+canonical+'"'),
                'Wrong post-name canonical: '+file);
            }
          }
          console.log('PASS:',pages.length,'pages;',checked,'local links and assets.');
          NODE
  browser-smoke:
    name: Browser smoke — mobile/desktop, light/dark
    needs: static-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser tests
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Check key pages and interactions
        run: |
          python3 -m http.server 4173 >/tmp/mgl-static-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const routes=['index.html','services/','solutions/','insights/','contact/','mt5-grey-label/'];
            try{
              for(const route of routes)for(const width of [360,390,768,1024,1440,1920])for(const theme of ['light','dark']){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[];
                page.on('pageerror',err=>errors.push(err.message));
                const response=await page.goto('http://127.0.0.1:4173/'+route+'?theme='+theme,{waitUntil:'networkidle'});
                if(!response || response.status()!==200)throw Error('HTTP failure: '+route);
                await page.locator('main').waitFor();
                await page.locator('.mgl-site-header').waitFor();
                const size=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
                if(size.scroll>size.client+2)throw Error('Horizontal overflow '+route+' at '+width+': '+JSON.stringify(size));
                if(route==='index.html'){
                  const capability=await page.evaluate(()=>{
                    const section=document.querySelector('.mgl-capability-strip');
                    const wrapper=section?.querySelector(':scope > .container');
                    if(!section||!wrapper)return null;
                    const outer=section.getBoundingClientRect();
                    const inner=wrapper.getBoundingClientRect();
                    const styles=getComputedStyle(wrapper);
                    return {outerWidth:outer.width,clientWidth:document.documentElement.clientWidth,
                      containerWidth:inner.width,paddingLeft:parseFloat(styles.paddingLeft),
                      paddingRight:parseFloat(styles.paddingRight)};
                  });
                  if(!capability || Math.abs(capability.outerWidth-capability.clientWidth)>3 ||
                    Math.abs(capability.containerWidth-capability.clientWidth)>3 ||
                    capability.paddingLeft<19 || capability.paddingRight<19){
                    throw Error('Capability ribbon width/gutters regression at '+width+': '+JSON.stringify(capability));
                  }
                }
                if(errors.length)throw Error('Browser errors '+route+': '+errors.join('; '));
                const typography=await page.evaluate(()=>{
                  const root=document.querySelector('main');
                  const h1=root?.querySelector('h1');
                  const h2=root?.querySelector('#services h2, .mgl-inner-section h2, .section-header h2, h2');
                  const px=e=>e?parseFloat(getComputedStyle(e).fontSize):null;
                  const service=document.querySelector('#services.mgl-solutions-section');
                  const inner=document.querySelector('.mgl-design .mgl-inner-section');
                  const top=e=>e?parseFloat(getComputedStyle(e).paddingTop):null;
                  return {h1:px(h1),h2:px(h2),serviceSpace:top(service),innerSpace:top(inner)};
                });
                const maxH1=width<=390?39:61;
                const maxH2=width<=390?31:41;
                if(!typography.h1||typography.h1>maxH1||
                   (typography.h2&&typography.h2>maxH2)||
                   (typography.serviceSpace!=null&&typography.serviceSpace>(width<=390?60:80))||
                   (typography.innerSpace!=null&&typography.innerSpace>76)){
                  throw Error('Oversized typography/spacing '+route+' '+width+'px: '+JSON.stringify(typography));
                }
                if(route==='index.html'){
                  const cards=page.locator('#services .mgl-solution-card');
                  if(await cards.count()!==6)throw Error('Expected six redesigned brokerage cards');
                  const result=await page.evaluate(()=>{
                    const section=document.querySelector('#services.mgl-solutions-section');
                    const grid=section?.querySelector('.mgl-solutions-grid');
                    if(!grid)return null;
                    const links=Array.from(grid.querySelectorAll('.mgl-solution-card__link'));
                    const columns=getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).length;
                    const rect=section.getBoundingClientRect();
                    const cs=getComputedStyle(section);
                    const cards=Array.from(grid.querySelectorAll('.mgl-solution-card'));
                    return {columns,cardCount:cards.length,links:links.length,
                      hasTitles:cards.every(c=>c.querySelector('h3')?.textContent?.trim()),
                      minLinkHeight:Math.min(...links.map(link=>link.getBoundingClientRect().height)),
                      horizontalBounds:rect.left>=-2&&rect.right<=document.documentElement.clientWidth+2,
                      background:cs.backgroundImage};
                  });
                  const expectedCols=width<576?1:width<992?2:3;
                  if(!result||result.columns!==expectedCols||result.cardCount!==6||
                    result.links!==6||!result.hasTitles||result.minLinkHeight<44||
                    !result.horizontalBounds){
                    throw Error('Brokerage solutions regression at '+width+'px: '+JSON.stringify(result));
                  }
                }
                if(route==='index.html'){
                  await page.locator('img[data-brand-logo]').waitFor();
                  await page.locator('img[data-brand-footer]').waitFor();
                  const brand=await page.evaluate(()=>{
                    const header=document.querySelector('img[data-brand-logo]');
                    const footer=document.querySelector('img[data-brand-footer]');
                    const favicon=document.querySelector('#site-favicon')||document.querySelector('link[rel="icon"][type="image/svg+xml"]');
                    return {header:header?.getAttribute('src'),footer:footer?.getAttribute('src'),icon:favicon?.getAttribute('href'),
                      headerLoaded:header?.complete&&header?.naturalWidth>0,footerLoaded:footer?.complete&&footer?.naturalWidth>0};
                  });
                  const filename=theme==='dark'?'logo-dark.svg':'logo-light.svg';
                  if(!brand.header?.includes(filename)||!brand.footer?.includes('logo-dark.svg')||
                     !brand.icon?.includes(theme==='dark'?'favicon-dark.svg':'favicon-light.svg')||
                     !brand.headerLoaded||!brand.footerLoaded){
                    throw Error('Logo/theme mismatch: '+route+' '+theme+' '+JSON.stringify(brand));
                  }
                }
                if ((width===360&&theme==='dark')||(width===1440&&theme==='light')){
                  const fs=require('node:fs');
                  fs.mkdirSync('tmp/static-visuals',{recursive:true});
                  await page.waitForTimeout(1600);
                  const filename=route.replace(/\//g,'__')+'--'+width+'--'+theme+'.png';
                  await page.screenshot({path:'tmp/static-visuals/'+filename,fullPage:true});
                }
                await page.close();
              }
              console.log('PASS 72 viewport/theme/browser checks with typography and spacing budgets');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-name-permalink-visual-qa
          path: tmp/static-visuals/
          if-no-files-found: ignore
          retention-days: 7
