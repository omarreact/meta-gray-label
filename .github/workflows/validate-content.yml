name: Validate shared Meta Grey Label website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify content and renderer
        run: |
          node --check theme-1/script.js
          node --check theme-2/script.js
          node --check theme-1/runtime.js
          node --check theme-2/runtime.js
          node scripts/sync-content.mjs --check
          node tests/standalone-source.mjs
  browser-smoke:
    needs: static-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
      - name: Test both layouts on desktop and mobile
        run: |
          python3 -m http.server 4173 >/tmp/mgl-static-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const routes=['home','services','solutions','insights','contact','mt5-grey-label'];
            const base='http://127.0.0.1:4173/';
            try {
              for(const layout of ['theme-1','theme-2'])for(const slug of routes)for(const width of [360,390,768,1024,1180,1440,1920])for(const mode of ['light','dark']){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                const url=new URL(layout+'/',base);url.searchParams.set('theme',mode);if(slug!=='home')url.searchParams.set('page',slug);
                const response=await page.goto(url.href,{waitUntil:'domcontentloaded'});
                if(!response||response.status()!==200)throw Error('HTTP '+url);
                await page.locator('#main-content').waitFor({timeout:15000});
                await page.locator('.mgl-site-header').waitFor();
                await page.locator('footer').waitFor();
                await page.locator('#mgl-dev-settings-toggle').waitFor();
                if(await page.locator('html').getAttribute('data-bs-theme')!==mode)throw Error('Theme mismatch '+url);
                const dimensions=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
                if(dimensions.scroll>dimensions.client+2)throw Error('Horizontal overflow '+url+' '+width+' '+JSON.stringify(dimensions));
                if(errors.length)throw Error('Browser errors '+url+': '+errors.join('; '));
                await page.close();
              }
              const page=await browser.newPage({viewport:{width:390,height:844}});
              await page.goto(base+'theme-1/?page=contact&theme=dark');
              await page.locator('#mgl-dev-settings-toggle').click();
              await page.locator('[data-layout-choice="theme-2"]').click();
              await page.waitForURL('**/theme-2/**');
              await page.locator('#main-content').waitFor();
              if(new URL(page.url()).searchParams.get('page')!=='contact')throw Error('Theme switch lost route');
              await page.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
