name: Temporary full-site inner-page release QA
on:
  push:
    branches: [feat/complete-static-inner-pages-20261119]
    paths: [.github/workflows/full-site-inner-pages-qa.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static routes, XML completeness, assets, navigation, and CSS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/style.css)" = "90b42525c97a20e380ca4c01edea60d3d3eb22d0"
          node --check assets/js/custom.js
          node --check assets/js/includes.js
          python3 - <<'PY'
          import json,re,xml.etree.ElementTree as ET
          from pathlib import Path
          from html.parser import HTMLParser
          root=Path('.')
          manifest=json.loads((root/'data/page-map.json').read_text())
          source=ET.parse(root/'data/content.xml').getroot()
          entries=manifest['pages'];original=source.findall('document')
          assert len(entries)==53 and len(original)==53
          expectedRoutes=set()
          errors=[]
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[];self.links=[];self.images=[];self.h1=0;self.paragraphs=0;self.content=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='h1':self.h1+=1
                  if t=='p':self.paragraphs+=1
                  if 'id' in a:self.ids.append(a['id'])
                  if 'href' in a:self.links.append(a['href'])
                  if 'src' in a:self.images.append(a['src'])
              def handle_data(self,data):self.content.append(data)
          audited=0
          files=[x['path'] for x in entries if x['path']!='index.html']
          files+=['services.html','solutions/index.html','insights/index.html']
          assert len(files)==55,len(files)
          assert len(set(files))==len(files)
          for name in files:
              path=root/name
              assert path.is_file(),f'Missing page {name}'
              html=path.read_text()
              a=Audit();a.feed(html);audited+=1
              assert a.h1==1,(name,'H1',a.h1)
              assert len(a.ids)==len(set(a.ids)),(name,'duplicate IDs')
              assert 'data-shared-part="header"' in html and 'data-shared-part="footer"' in html,name
              assert 'assets/js/includes.js' in html,name
              assert '[Client Name]' not in html,name
              for u in a.images+a.links:
                  if not u or u.startswith(('http://','https://','mailto:','tel:','data:','javascript:','#','//')):continue
                  dest=(path.parent/u.split('#')[0].split('?')[0]).resolve()
                  if not str(dest).startswith(str(root.resolve())):errors.append((name,'path escaping root',u));continue
                  if u.split('#')[0].endswith('/'):dest=dest/'index.html'
                  if not dest.exists():errors.append((name,'missing asset/link',u))
              original_doc=next((d for d in entries if d['path']==name),None)
              if original_doc and original_doc['status']=='available' and original_doc['title']!='Client Testimonials':
                  assert a.paragraphs>=original_doc['sourceParagraphs'],(name,a.paragraphs,original_doc['sourceParagraphs'])
              if original_doc and original_doc['title'] in ['Contact','Privacy Policy','Terms of Service','Client Testimonials']:
                  assert 'content="noindex,follow"' in html,(name,'draft needs noindex')
          homepage=(root/'index.html').read_text()
          assert 'fab fa-facebook' not in homepage and 'fab fa-twitter' not in homepage, 'Demo social icons remain'
          assert 'href="solutions/" class="trk-btn trk-btn--primary trk-btn--arrow"' in homepage
          assert 'href="insights/" class="trk-btn trk-btn--border trk-btn--primary mt-15"' in homepage
          js=(root/'assets/js/custom.js').read_text()
          assert 'var submenu = element.querySelector(":scope > .submenu")' in js, 'Mobile submenus not guarded'
          assert not errors,errors[:25]
          assert (root/'robots.txt').is_file() and (root/'sitemap.xml').is_file()
          footer=(root/'footer.html').read_text()
          assert footer.count('mgl-share-whatsapp')==1 and footer.count('mgl-share-telegram')==1
          assert 'fab fa-facebook' not in footer and 'fab fa-instagram' not in footer and 'fab fa-twitter' not in footer
          print('PASS static: 55 new pages, 53 documents, all paragraphs, local paths, SEO, and preserved CSS')
          PY
      - name: Nested routes render in real browser light and dark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          probes=[
           'services.html',
           'solutions/index.html',
           'insights/index.html',
           'forex-grey-label/index.html',
           'forex-crm/back-office/index.html',
           'insights/meta-trader-grey-label-test/index.html',
           'contact/index.html',
          ]
          for p in probes:
              if p.startswith('insights/meta-trader-grey-label-test'):
                  p='insights/white-label-grey-label-or-turnkey-choosing-the-right-model/index.html'
              path=Path(p)
              assert path.exists(),p
              s=path.read_text()
              js=r"""<script>
              window.addEventListener('load',()=>setTimeout(()=>{
                const q=s=>document.querySelector(s),img=q('img[data-brand-logo]'),footer=q('img[data-brand-footer]');
                const hero=q('.mgl-inner-hero')||q('.mgl-page-hero');
                const out={route:location.pathname,theme:document.documentElement.getAttribute('data-bs-theme'),
                header:!!q('header'),footer:!!q('footer'),logoSrc:img?.getAttribute('src'),logoLoaded:!!img?.complete&&img.naturalWidth>0,
                footerLoaded:!!footer?.complete&&footer.naturalWidth>0,
                hero:!!hero, h1:document.querySelectorAll('h1').length,
                logoWidth:img?.getBoundingClientRect().width,
                toggle:!!q('#btnSwitch'),wa:document.querySelectorAll('header .mgl-share-whatsapp').length,
                tg:document.querySelectorAll('footer .mgl-share-telegram').length,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                links:[...document.querySelectorAll('header a[href*="services.html"]')].map(a=>a.href),
                };
                const el=document.createElement('script');el.type='application/json';el.id='qa-runtime';el.textContent=JSON.stringify(out);document.body.append(el);
              },1700));
              </script>"""
              path.with_name('__qa.html').write_text(s.replace('</body>',js+'</body>'))
          PY
          python3 -m http.server 8183 --bind 127.0.0.1 >/tmp/meta-site-http.log 2>&1 &
          server=$!; trap 'kill "$server" || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          for page in services solutions insights forex-grey-label forex-crm/back-office insights/white-label-grey-label-or-turnkey-choosing-the-right-model contact; do
            if [ "$page" = "services" ]; then rel="__qa.html"; else rel="$page/__qa.html"; fi
            for mode in light dark; do
              timeout 30 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5900 --window-size=390,844 --dump-dom \
              "http://127.0.0.1:8183/$rel?theme=$mode" > /tmp/qa-render.html 2>/tmp/chrome.log
              PAGE="$page" MODE="$mode" python3 - <<'PY'
          import os,re,json,html
          raw=open('/tmp/qa-render.html').read()
          m=re.search(r'<script type="application/json" id="qa-runtime">(.+?)</script>',raw,re.S)
          assert m,(os.environ['PAGE'],os.environ['MODE'],'missing JS probe')
          data=json.loads(html.unescape(m.group(1)))
          assert data['theme']==os.environ['MODE'],data
          assert data['header'] and data['footer'] and data['hero'] and data['toggle'],data
          assert data['h1']==1,data
          assert data['logoLoaded'] and data['footerLoaded'],data
          assert data['logoSrc'].endswith('logo-dark.svg' if data['theme']=='dark' else 'logo-light.svg'),data
          assert data['wa']==1 and data['tg']==1,data
          assert data['overflow']<=3,data
          assert any(a.endswith('/services.html') for a in data['links']),data
          print(f"PASS {os.environ['PAGE']} {os.environ['MODE']}: nested assets, social icons, navigation, theme; overflow={data['overflow']}")
          PY
            done
          done
