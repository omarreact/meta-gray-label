name: Build offline Meta Grey Label WordPress theme
on:
  push:
    branches: [build/standalone-wordpress-v2.1]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate installable offline theme
        run: python3 packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: meta-grey-label-standalone-v2.1
          path: dist/meta-grey-label-standalone.zip
          if-no-files-found: error
          retention-days: 14
