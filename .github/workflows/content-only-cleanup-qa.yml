name: Temporary content cleanup QA
on:
  push:
    branches: [cleanup/source-backed-menu-pages-20261119]
    paths: [.github/workflows/content-only-cleanup-qa.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Source, files, links and preserved design
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/style.css)" = "90b42525c97a20e380ca4c01edea60d3d3eb22d0"
          node --check assets/js/custom.js
          node --check assets/js/includes.js
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import unquote,urlsplit
          root=Path('.').resolve()
          removed=['about-us/testimonials/index.html','forex-crm/traders-room/index.html',
                   'contact/index.html','privacy-policy/index.html','terms-of-service/index.html']
          assert all(not (root/p).exists() for p in removed), 'Unverified pages still present'
          manifest=json.loads((root/'data/page-map.json').read_text())
          assert len(ET.parse(root/'data/content.xml').getroot().findall('document'))==53
          assert len(manifest['pages'])==48
          assert all(x['status']=='available' and x['title']!='Client Testimonials'
                     and x['sourceParagraphs']==x['renderedParagraphs']
                     and (root/x['path']).exists() for x in manifest['pages'])
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[];self.links=[];self.assets=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='a' and 'href' in a:self.links.append(a['href'])
                  if tag=='link' and 'href' in a:self.assets.append(a['href'])
                  if tag in ('script','img','source') and 'src' in a:self.assets.append(a['src'])
          pages=sorted(root.rglob('*.html'))
          assert len(pages)==54,f'Expected 52 public pages + header/footer, got {len(pages)}'
          parsed={}
          for page in pages:
              obj=Inspector();obj.feed(page.read_text());parsed[page]=obj
              assert len(obj.ids)==len(set(obj.ids)),f'Duplicate ID: {page}'
          broken=[]
          for page,obj in parsed.items():
              for address in obj.links+obj.assets:
                  if not address or address=='#' or address.startswith(('http:','https:','mailto:','tel:','data:','javascript:','//')):continue
                  parsedUrl=urlsplit(address)
                  sub=unquote(parsedUrl.path)
                  if sub.startswith('/'):broken.append((str(page),'absolute link',address));continue
                  target=(page.parent/sub).resolve() if sub else page
                  if not str(target).startswith(str(root)):
                      broken.append((str(page),'path escape',address));continue
                  if target.is_dir():target=target/'index.html'
                  if not target.exists():broken.append((str(page),'missing file',address));continue
                  if parsedUrl.fragment and target.suffix=='.html' and target in parsed and parsedUrl.fragment not in parsed[target].ids:
                      broken.append((str(page),'missing anchor',address))
          assert not broken,broken[:30]
          h=(root/'header.html').read_text();f=(root/'footer.html').read_text()
          assert h.count('<ul class="submenu">')==2
          assert 'home-showcase' not in h
          assert 'contact/' not in h and 'traders-room/' not in h
          assert 'privacy-policy/' not in f and 'terms-of-service/' not in f
          assert 'footer__app-item' not in f
          assert h.count('class="mgl-social-link mgl-share-')==2
          assert f.count('class="social__link social__link--style22 mgl-share-icon')==2
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs=[x.text for x in ET.parse(root/'sitemap.xml').getroot().findall('.//s:loc',ns)]
          for loc in locs:
              prefix='https://omarreact.github.io/meta-gray-label/'
              assert loc.startswith(prefix),loc
              relative=loc[len(prefix):];p=(root/relative)
              if p.is_dir():p=p/'index.html'
              if not relative:p=root/'index.html'
              assert p.is_file(),f'Sitemap dead route {loc}'
          print('PASS static 52 public pages; 48 verified source documents; all links/assets/anchors; correct menu; unchanged stylesheet')
          PY
      - name: Browser smoke QA for key routes and both themes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          candidates=['index.html','services.html','solutions/index.html','insights/index.html','forex-white-label/index.html','forex-crm/index.html','about-us/index.html']
          probe="""<script>
            window.addEventListener('load',()=>setTimeout(()=>{
              const q=s=>document.querySelector(s),nav=q('header ul.menu--style1'),logo=q('img[data-brand-logo]');
              const d={width:innerWidth,theme:document.documentElement.getAttribute('data-bs-theme'),
              header:!!q('header'),footer:!!q('footer'),logo:!!logo?.complete&&logo.naturalWidth>0,
              logoSrc:logo?.getAttribute('src'),
              labels:nav?[...nav.querySelectorAll(':scope > li > a')].map(a=>a.textContent.trim()):[],
              submenus:nav?.querySelectorAll(':scope > li > .submenu').length,
              social:document.querySelectorAll('header .mgl-share-whatsapp,header .mgl-share-telegram,footer .mgl-share-whatsapp,footer .mgl-share-telegram').length,
              toggle:!!q('#btnSwitch'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
              const s=document.createElement('script');s.type='application/json';s.id='qa-cleanup';s.textContent=JSON.stringify(d);document.body.append(s);
            },1300));
          </script>"""
          for p in candidates:
              path=Path(p)
              target='__qa_services.html' if p=='services.html' else '__qa.html'
              path.with_name(target).write_text(path.read_text().replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8146 --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          pid=$!;trap 'kill "$pid" || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          for path in /__qa.html /__qa_services.html /solutions/__qa.html /insights/__qa.html /forex-white-label/__qa.html /forex-crm/__qa.html /about-us/__qa.html; do
            for mode in light dark; do
              timeout 35 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5500 --window-size=390,850 --dump-dom \
                "http://127.0.0.1:8146$path?theme=$mode" >/tmp/dom.html 2>/tmp/chrome.log
              MODE="$mode" PATH_QA="$path" python3 - <<'PY'
          import re,json,html,os
          result=re.search(r'<script type="application/json" id="qa-cleanup">(.+?)</script>',open('/tmp/dom.html').read(),re.S)
          assert result,os.environ['PATH_QA']
          d=json.loads(html.unescape(result.group(1)))
          assert d['theme']==os.environ['MODE'],d
          assert d['header'] and d['footer'] and d['logo'] and d['toggle'],d
          assert d['logoSrc'].endswith('logo-dark.svg' if d['theme']=='dark' else 'logo-light.svg'),d
          assert d['labels']==['Solutions','Services','Company','Insights','FAQs'],d
          assert d['submenus']==2 and d['social']==4,d
          assert d['overflow']<=3,d
          print(f"PASS {os.environ['PATH_QA']} {d['theme']}: 5 menus, 2 submenus, 4 sharing icons, no overflow")
          PY
            done
          done

      - name: Desktop navigation geometry and dropdown arrows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          probe="""<script>
          window.addEventListener('load',()=>setTimeout(()=>{
            const h=document.querySelector('header .header-wrapper');
            const logo=h?.querySelector(':scope > .logo'),area=h?.querySelector(':scope > .menu-area'),
              action=h?.querySelector(':scope > .header-action'),
              menu=area?.querySelector('.menu--style1'),
              first=menu?.querySelector(':scope > li > a');
            const box=e=>{const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,cx:r.x+r.width/2,cy:r.y+r.height/2}:null};
            const arrow=first?getComputedStyle(first,'::after'):null;
            const d={width:innerWidth,logo:box(logo),area:box(area),menu:box(menu),action:box(action),
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              menuDisplay:menu?getComputedStyle(menu).display:null,justify:menu?getComputedStyle(menu).justifyContent:null,
              arrowWidth:arrow?.borderBottomWidth,footer:!!document.querySelector('footer')};
            const x=document.createElement('script');x.type='application/json';x.id='qa-desktop';x.textContent=JSON.stringify(d);document.body.append(x);
          },1350));</script>"""
          Path('__qa_desktop.html').write_text(s.replace('</body>',probe+'</body>'))
          PY
          python3 -m http.server 8147 --bind 127.0.0.1 >/tmp/desktop.log 2>&1 &
          pid=$!;trap 'kill "$pid" || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v chromium || true)"
          for width in 1280 1440 1650; do
            timeout 35 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5500 --window-size="$width,900" --dump-dom \
              "http://127.0.0.1:8147/__qa_desktop.html" > /tmp/desktop-dom.html 2>/tmp/chrome-errors.log
            REQUESTED_WIDTH="$width" python3 - <<'PY'
          import re,json,html,os
          m=re.search(r'<script type="application/json" id="qa-desktop">(.+?)</script>',open('/tmp/desktop-dom.html').read(),re.S)
          assert m, 'Missing desktop measurements'
          d=json.loads(html.unescape(m.group(1)))
          assert d['footer'] and d['menuDisplay']!='none',d
          assert d['menu'] and d['logo'] and d['action'] and d['area'],d
          assert abs(d['menu']['cx']-d['area']['cx'])<12,d
          assert abs(d['menu']['cy']-d['logo']['cy'])<35,d
          assert d['menu']['x']>=d['logo']['right']-8,d
          assert d['menu']['right']<=d['action']['x']+8,d
          assert d['arrowWidth']=='2px',d
          assert d['overflow']<=3,d
          print(f"PASS desktop requested={os.environ['REQUESTED_WIDTH']} innerWidth={d['width']} nav centered, chevrons visible")
          PY
          done
