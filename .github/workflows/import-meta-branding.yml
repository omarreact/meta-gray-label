name: Import Meta Grey Label branding (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-meta-branding.yml

permissions:
  contents: write

jobs:
  import-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download eight verified branding assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/branding
          while read -r expected filename; do
            path="media/branding/$filename"
            curl --fail --location --silent --show-error --retry 3 \
              "https://raw.githubusercontent.com/omarreact/mt5-gl/4f36e9c813b0cd4f6008634fc5bd05eb33a9716f/media/branding/$filename" \
              --output "$path"
            actual="$(git hash-object "$path")"
            if [ "$expected" != "$actual" ]; then
              echo "Checksum mismatch for $filename: $actual" >&2
              exit 1
            fi
            echo "VERIFIED $filename"
          done <<'CHECKSUMS'
          dd650fe6c5bb34bd7c7c6159da0003e1e90ff76b apple-touch-icon.png
          f61c9868c536c66f39e16fa6f91bcf5f7bd77b3f favicon-32.png
          c0a349bd69e260cdde7d044d6bec939b0a8520ac favicon.svg
          3ec04bddab381c692e9cf3e0ffbbf36d273e6e3d icon-192.png
          104efe990f9638f314caa89b3db26210039c634e icon-512.png
          956d1f68d9dc9cd03f85080d9336c139dd453302 logo-dark.svg
          1893bfc43ee49b24f1bd945d2d8ed20a9ab8eed1 logo-light.svg
          e4da56852514a8c5b78d64f1fe66e9d0e443d858 logo-symbol.svg
          CHECKSUMS

      - name: Replace original Bitrader branding references only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const swap = (path, needle, replacement, expected = 1) => {
            const text = fs.readFileSync(path, 'utf8');
            const hits = typeof needle === 'string'
              ? text.split(needle).length - 1
              : [...text.matchAll(new RegExp(needle.source, 'g'))].length;
            if (hits !== expected) {
              throw new Error(path + ': expected ' + expected + ' occurrence(s), found ' + hits + ' for ' + needle);
            }
            const updated = typeof needle === 'string'
              ? text.split(needle).join(replacement)
              : text.replace(needle, replacement);
            fs.writeFileSync(path, updated, 'utf8');
          };

          // Preserve original header/footer geometry: existing logos are 183x30.
          swap('header.html',
            '<img class="dark" src="./assets/images/logo/logo.png" alt="logo">',
            '<img data-brand-logo src="./media/branding/logo-light.svg" alt="Meta Grey Label" width="183" height="30">');
          swap('footer.html',
            '<img src="./assets/images/logo/logo-dark.png"',
            '<img src="./media/branding/logo-dark.svg" width="183" height="30"');
          swap('footer.html', 'alt="Logo"', 'alt="Meta Grey Label"');
          swap('footer.html',
            /<p class=" mb-0">© 2024 All Rights Reserved By <a href="https:\/\/themeforest\.net\/user\/thetork\/portfolio"\s+target="_blank">Thetork<\/a>/,
            '<p class=" mb-0">© 2026 All Rights Reserved By <a href="index.html">Meta Grey Label</a>');

          // Browser tab, social preview and platform branding.
          swap('index.html',
            'Bitrader - Professional Multipurpose HTML Template for Your Crypto, Forex, Stocks & Day Trading Business',
            'Meta Grey Label | Brokerage Technology', 3);
          swap('index.html',
            'content="Bitrader, Crypto, Forex, and Stocks Trading Business"',
            'content="Meta Grey Label, brokerage technology, white-label trading, forex, trading platforms"');
          swap('index.html',
            /content="Experience the power of Bitrader,[^"]*"/,
            'content="Meta Grey Label — brokerage technology and multi-asset trading solutions."');
          swap('index.html',
            /content="Welcome to Bitrader,[^"]*"/,
            'content="Meta Grey Label — brokerage technology and multi-asset trading solutions."');
          swap('index.html',
            'content=Bitrader',
            'content="Meta Grey Label"');
          swap('index.html',
            'https://thetork.com/demos/html/bitrader/',
            'https://omarreact.github.io/meta-gray-label/');
          swap('index.html',
            'content="./assets/images/og.png"',
            'content="./media/branding/icon-512.png"');
          swap('index.html',
            '<link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon">',
            '<link rel="icon" type="image/svg+xml" href="./media/branding/favicon.svg">\n' +
            '  <link rel="icon" type="image/png" sizes="32x32" href="./media/branding/favicon-32.png">\n' +
            '  <link rel="apple-touch-icon" href="./media/branding/apple-touch-icon.png">');
          swap('index.html',
            '<img src="./assets/images/logo/preloader.png" alt="preloader icon">',
            '<img src="./media/branding/logo-symbol.svg" alt="Meta Grey Label loading" width="120" height="90">');
          swap('index.html',
            'by the help of Bitrader through online.',
            'by the help of Meta Grey Label through online.');

          // Existing image theme logic expects "-dark" suffix. The supplied
          // artwork is named logo-light.svg and logo-dark.svg, so switch only
          // the brand image explicitly without altering other theme behavior.
          swap('assets/js/custom.js',
            '    changeImage(themeMode);',
            '    changeImage(themeMode);\n' +
            '    const brandLogo = document.querySelector("img[data-brand-logo]");\n' +
            '    if (brandLogo) {\n' +
            '        const filename = themeMode === "dark" ? "logo-dark.svg" : "logo-light.svg";\n' +
            '        brandLogo.src = brandLogo.src.replace(/logo-(?:light|dark)\\.svg$/, filename);\n' +
            '    }');
          NODE

      - name: Validate branding and protect CSS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object assets/css/style.css)" = "90b42525c97a20e380ca4c01edea60d3d3eb22d0"
          node --check assets/js/custom.js
          node --check assets/js/includes.js
          grep -Fq 'data-brand-logo src="./media/branding/logo-light.svg"' header.html
          grep -Fq 'src="./media/branding/logo-dark.svg"' footer.html
          grep -Fq 'media/branding/favicon.svg' index.html
          grep -Fq 'media/branding/logo-symbol.svg' index.html
          if grep -Eq 'assets/images/(logo/(logo|preloader)|favicon)' index.html header.html footer.html; then
            echo "Legacy active logo reference found" >&2
            exit 1
          fi
          git diff --check

      - name: Commit branding update to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/branding index.html header.html footer.html assets/js/custom.js
          if ! git diff --cached --quiet; then
            git commit -m "Apply Meta Grey Label branding with responsive theme logos"
            git push origin HEAD:main
          fi
