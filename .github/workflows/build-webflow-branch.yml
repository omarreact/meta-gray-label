name: Publish static website to Webflow branch
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "home-2/**"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/**"
      - "inner-pages/**"
      - "webflow.json"
      - ".github/workflows/build-webflow-branch.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webflow-deployment-branch
  cancel-in-progress: true
jobs:
  build-webflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify standalone assets
        run: |
          test -f index.html
          test -f home-2/index.html
          test -f home-2/style.css
          test -f home-2/script.js
          test -f inner-pages/mt5-grey-label.html
          test -f assets/js/includes.js
      - name: Publish standalone HTML website
        run: |
          rm -rf /tmp/mgl-webflow
          mkdir -p /tmp/mgl-webflow
          cp -a index.html 404.html robots.txt sitemap.xml webflow.json assets home-2 inner-pages /tmp/mgl-webflow/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan webflow-build
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/mgl-webflow/. .
          git add -A
          git commit -m "Publish standalone static Webflow website from main"
          git push --force origin HEAD:webflow
