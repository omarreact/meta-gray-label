name: Build Webflow deployment branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-webflow-branch.yml"
      - "data/content.json"
      - "header.html"
      - "footer.html"
      - "index.html"
      - "services.html"
      - "solutions/**"
      - "insights/**"
      - "contact/**"
      - "assets/**"
      - "media/**"
      - "src/renderer.js"
      - "scripts/static-site-lib.mjs"
      - "scripts/build-static.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webflow-deployment-branch
  cancel-in-progress: true

jobs:
  build-webflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Webflow root-host static output
        env:
          PUBLIC_BASE_URL: https://mg-label.webflow.io
          BASE_PATH: ""
        run: |
          node scripts/build-static.mjs
          test -f dist/public/index.html
          test -f dist/public/about-us/index.html
          test -f dist/public/forex-grey-label/mt5-grey-label/index.html
          grep -q 'https://mg-label.webflow.io/about-us/' dist/public/about-us/index.html
          ! grep -R -q 'meta-gray-label-dynamic.farukkhanone.workers.dev' dist/public
          ! grep -R -q '/meta-gray-label/assets/' dist/public

      - name: Publish generated-only Webflow branch
        run: |
          rm -rf /tmp/mgl-webflow
          mkdir -p /tmp/mgl-webflow
          cp -a dist/public/. /tmp/mgl-webflow/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan webflow-build
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/mgl-webflow/. .
          git add -A
          git commit -m "Build Webflow static deployment from main"
          git push --force origin HEAD:webflow
