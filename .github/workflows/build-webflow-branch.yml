name: Publish Meta Grey Label static website to Webflow branch
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "theme-1/**"
      - "theme-2/**"
      - "assets/**"
      - "site-content.json"
      - "site-manifest.json"
      - "pages.xml"
      - "sitemap.xml"
      - "robots.txt"
      - "webflow.json"
      - ".github/workflows/build-webflow-branch.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: webflow-deployment-branch
  cancel-in-progress: false
jobs:
  build-webflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate source
        run: |
          node scripts/sync-content.mjs --check
          node tests/standalone-source.mjs
      - name: Publish static website without rewriting branch history
        run: |
          mkdir -p /tmp/mgl-webflow
          cp -a index.html 404.html robots.txt sitemap.xml webflow.json design-tokens.json site-content.json site-manifest.json pages.xml assets theme-1 theme-2 /tmp/mgl-webflow/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin webflow
          git checkout -B webflow-build origin/webflow
          git rm -r --ignore-unmatch .
          cp -a /tmp/mgl-webflow/. .
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish shared Meta Grey Label website from main"
          git push origin HEAD:webflow
